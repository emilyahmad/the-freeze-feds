<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pad test</title>
  <!-- Pad test (hardware/pad-test/pad-test.ino): connect to the s'mores-pad over Web Bluetooth (Chrome) and show
       "works" on every key press. Served by the dev server at /pad-test.html. -->
  <style>
    :root { --ink: #14303c; --ice: #4ec8f3; --bad: #e44023; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; font: 18px/1.4 system-ui, sans-serif;
      color: var(--ink); background: linear-gradient(180deg, #36474b 0%, #7db9c9 55%, #96e6fd 100%); }
    main { width: min(560px, 100%); background: rgba(250, 246, 255, .95); border: 4px solid #fff; border-radius: 24px; padding: 28px;
      text-align: center; box-shadow: 0 6px 0 #123c5e, 0 14px 30px rgba(18, 60, 94, .35); }
    h1 { margin: 0 0 4px; font-size: 22px; }
    #status { margin: 0 0 20px; color: #4a6470; }
    #status.bad { color: var(--bad); }
    button { font: inherit; font-weight: 700; color: #fff; cursor: pointer; padding: .5em 1.3em; border: 3px solid #fff; border-radius: 14px;
      background: linear-gradient(180deg, #bff3ff 0%, var(--ice) 42%, #1aa0df 100%); box-shadow: 0 4px 0 #123c5e; }
    button:disabled { opacity: .5; cursor: default; }
    #big { margin: 24px 0 8px; font-size: clamp(48px, 14vw, 96px); font-weight: 800; color: #c9d6dc; }
    #big.on { color: #1aa0df; animation: pop .35s cubic-bezier(.2, 1.4, .35, 1); }
    @keyframes pop { from { transform: scale(.6); } }
    #last { min-height: 1.4em; color: #4a6470; }
  </style>
</head>
<body>
  <main>
    <h1>Macropad test</h1>
    <p id="status">Flash hardware/pad-test/pad-test.ino, then click Connect and pick “FreezePad”.</p>
    <button id="connect" type="button">Connect pad</button>
    <div id="big">…</div>
    <div id="last"></div>
  </main>
  <script>
    const SERVICE = '6e0f0001-5a1e-4f2e-9c1b-f2ee2efd0001', KEYS = '6e0f0002-5a1e-4f2e-9c1b-f2ee2efd0001';   // as in pad-test.ino
    const $ = (s) => document.querySelector(s), btn = $('#connect');
    const status = (text, bad = false) => { $('#status').textContent = text; $('#status').classList.toggle('bad', bad); };
    let count = 0;

    if (!navigator.bluetooth) { status('This browser has no Web Bluetooth: open this page in Chrome.', true); btn.disabled = true; }

    btn.onclick = async () => {
      try {
        status('Pick “FreezePad” in the list…');
        const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }, { name: 'FreezePad' }], optionalServices: [SERVICE] });
        device.addEventListener('gattserverdisconnected', () => { status('Disconnected. Click Connect again.', true); btn.disabled = false; });
        status('Connecting…');
        const server = await device.gatt.connect();
        const keys = await (await server.getPrimaryService(SERVICE)).getCharacteristic(KEYS);
        keys.addEventListener('characteristicvaluechanged', (e) => {
          const name = new TextDecoder().decode(e.target.value);
          const big = $('#big'); big.textContent = 'works ✓'; big.classList.remove('on'); void big.offsetWidth; big.classList.add('on');
          $('#last').textContent = `${name} pressed (${++count})`;
          console.log('pad:', name);
        });
        await keys.startNotifications();
        status('Connected. Press any key on the pad.'); btn.disabled = true;
      } catch (err) {
        console.warn(err);
        status(err.name === 'NotFoundError' ? 'No pad picked (or Chrome can’t see it: is the pad on and flashed with pad-test.ino?)' : `${err.name}: ${err.message}`, true);
      }
    };
  </script>
</body>
</html>
