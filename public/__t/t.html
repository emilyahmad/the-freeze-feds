<pre id=o>running</pre><script type=module>
import * as sfx from '../src/sfx.js';
const o = document.getElementById('o');
try {
  sfx.unlock(); sfx.crowdLevel(1);
  await new Promise(r => setTimeout(r, 1500));
  o.textContent = 'ok';
} catch (e) { o.textContent = 'ERR ' + e; }
window.onerror = (m) => o.textContent += ' ERR ' + m;
window.onunhandledrejection = (e) => o.textContent += ' REJ ' + e.reason;
</script>
